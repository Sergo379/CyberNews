apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
      app.kubernetes.io/part-of: cybernews
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: cybernews
        app.kubernetes.io/version: lab3
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notifications
          image: cybernews/notifications:lab3
          imagePullPolicy: Never
          command: ["python", "-m", "cybernews_runtime"]
          envFrom:
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: notifications-config
            - secretRef:
                name: notifications-credentials
          ports:
            - {name: http, containerPort: 8000}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 2
