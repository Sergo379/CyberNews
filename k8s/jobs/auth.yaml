apiVersion: batch/v1
kind: Job
metadata:
  generateName: migrate-auth-
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: migrate-auth
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate-auth
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: cybernews
        app.kubernetes.io/version: lab3
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: cybernews/auth:lab3
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          workingDir: /srv
          envFrom:
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 350m, memory: 256Mi}
