apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: postgres-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "cybernews_lab3_admin"
  POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: rabbitmq-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  RABBITMQ_DEFAULT_USER: "cybernews_lab3"
  RABBITMQ_DEFAULT_VHOST: "cybernews"
  RABBITMQ_NODENAME: "rabbit@rabbitmq-0"
