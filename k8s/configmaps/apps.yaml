apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: backend-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: auth-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  SERVICE_NAME: "auth"
  DB_NAME: "auth_db"
  DB_USER: "auth_svc"
  ACCESS_TOKEN_TTL_SECONDS: "900"
  ADMIN_SESSION_TTL_SECONDS: "900"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: collector-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  SERVICE_NAME: "collector"
  DB_NAME: "collector_db"
  DB_USER: "collector_svc"
  AUTH_SERVICE_URL: "http://auth:8000"
  ARTICLE_SERVICE_URL: "http://articles:8000"
  RSS_AUTO_SYNC: "true"
  RSS_SYNC_INTERVAL_SECONDS: "1800"
  RSS_MAX_BYTES: "2097152"
  RSS_ALLOWED_HOSTS: "feeds.feedburner.com,www.bleepingcomputer.com,bleepingcomputer.com,krebsonsecurity.com,www.krebsonsecurity.com"
  RES_OPTIONS: "attempts:1 timeout:2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: articles-config
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: articles-config
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
data:
  SERVICE_NAME: "articles"
  DB_NAME: "article_db"
  DB_USER: "article_svc"
  AUTH_SERVICE_URL: "http://auth:8000"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_USER: "cybernews_lab3"
  RABBITMQ_VHOST: "cybernews"
---
