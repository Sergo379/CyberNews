apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: cybernews
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cybernews
        app.kubernetes.io/version: lab3
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.12-bookworm
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-credentials
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["sh", "-ec", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
