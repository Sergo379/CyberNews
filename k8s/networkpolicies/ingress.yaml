    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes: [Ingress]
  ingress:
