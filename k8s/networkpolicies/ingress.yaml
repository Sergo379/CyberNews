apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cybernews
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: default-deny-cybernews
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cybernews
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-backends
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: gateway-to-backends
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-auth
  namespace: cybernews-lab3
  labels:
    app.kubernetes.io/name: backend-to-auth
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: cybernews
    app.kubernetes.io/version: lab3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [collector, articles, community, moderation, notifications]}
      ports:
        - {protocol: TCP, port: 8000}
---
